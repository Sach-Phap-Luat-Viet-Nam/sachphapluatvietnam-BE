# Production trên một máy Linux: API + PostgreSQL + Redis + FE (storefront, admin) + Cloudflare Tunnel.
# Hướng dẫn: docs/deploy-linux.md. Build và khởi động bằng: bash deploy/update.sh
# (FE phải build sau khi API đã chạy vì lúc build Next.js render trước trang tĩnh bằng dữ liệu từ API).
# Biến ${...} đọc từ deploy/.env (mẫu deploy/.env.example), cấu hình API đọc thêm từ deploy/api.env.
name: sachluat-prod

# Docker mặc định không giới hạn log container: giới hạn để log không làm đầy ổ đĩa.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-frontend-env: &frontend-env
  # Gọi backend trong mạng compose, không đi vòng qua internet.
  API_BASE_URL: http://api:8080
  PROXY_SECRET: ${PROXY_SECRET:?Set PROXY_SECRET in deploy/.env}
  # Sau Cloudflare, x-forwarded-for giả được; cf-connecting-ip do Cloudflare đặt.
  CLIENT_IP_HEADER: cf-connecting-ip

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sachluat
      POSTGRES_USER: sachluat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sachluat -d sachluat"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sachluat-api:latest
    restart: unless-stopped
    env_file: api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=sachluat;Username=sachluat;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      # Một instance duy nhất nên tự áp migration khi khởi động.
      Database__ApplyMigrationsOnStartup: "true"
      TrustedProxy__Secret: ${PROXY_SECRET}
      Ordering__AdminBaseUrl: ${ADMIN_URL:?Set ADMIN_URL in deploy/.env}
    # Chỉ mở cho chính máy này (kiểm tra health, build FE); internet vào qua cloudflared trong mạng compose.
    # Cổng Docker mở ra 0.0.0.0 sẽ đi vòng qua ufw, nên không bỏ tiền tố 127.0.0.1.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  storefront:
    build:
      context: ${FE_DIR:-../../sachphapluatvietnam-FE}
      # Bước build gọi API qua cổng 127.0.0.1:8080 của máy chủ.
      network: host
      args:
        APP: storefront
        API_BASE_URL: http://127.0.0.1:8080
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
    image: sachluat-storefront:latest
    restart: unless-stopped
    environment: *frontend-env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    logging: *logging

  admin:
    build:
      context: ${FE_DIR:-../../sachphapluatvietnam-FE}
      network: host
      args:
        APP: admin
        API_BASE_URL: http://127.0.0.1:8080
        NEXT_PUBLIC_STOREFRONT_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL in deploy/.env}
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
    image: sachluat-admin:latest
    restart: unless-stopped
    environment: *frontend-env
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - api
      - storefront
      - admin
    logging: *logging

volumes:
  postgres-data:
  redis-data:
