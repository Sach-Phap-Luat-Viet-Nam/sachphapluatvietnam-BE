# Kiểm tra "định nghĩa xong việc" (CLAUDE.md) cho mỗi push lên main và mỗi pull request:
# format, build không warning, toàn bộ test (kể cả test cần PostgreSQL + Redis), build Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Container chỉ sống trong job và không mở ra ngoài runner, nên không cần mật khẩu.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SACHLUAT_TEST_DB: Host=localhost;Port=5432;Database=sachluat_test;Username=postgres
      SACHLUAT_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SachLuat.slnx

      - name: Check format
        run: dotnet format SachLuat.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SachLuat.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution SachLuat.slnx --configuration Release --no-build

  # Build image deploy (không push) để bắt sớm lỗi Dockerfile, ví dụ quên COPY csproj của module mới.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag sachluat-api:ci .
